name: Build Balanced Buyte AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install
      - run: bun run build

      # Clear old files in public_html
      - run: rm -rf public_html/*

      # Copy new build output into public_html
      - run: cp -r dist/* public_html/

      - uses: actions/upload-artifact@v4
        with:
          name: balanced-buyte-dist
          path: dist
